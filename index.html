<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易經塔羅 · 瀏覽卦</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold:    #c9a84c;
  --gold-lt: #e8d08a;
  --dark:    #0d0b14;
  --dark2:   #16122a;
  --dark3:   #1e1a35;
  --purple:  #2e2060;
  --text:    #e8dfc8;
  --text-dim:#a09070;
}
html, body { height: 100%; background: var(--dark); color: var(--text); font-family: 'Noto Serif TC', 'Source Han Serif TC', 'STSong', serif; overflow-x: hidden; }

/* ── Nav ── */
nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: linear-gradient(180deg, #0a0818 0%, rgba(10,8,24,0) 100%); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(201,168,76,0.2); }
.nav-title { font-size: 1.3rem; letter-spacing: .25em; color: var(--gold); text-shadow: 0 0 18px rgba(201,168,76,0.6); }
.nav-tabs  { display: flex; gap: 6px; }
.tab-btn { padding: 8px 18px; border: 1px solid rgba(201,168,76,0.35); border-radius: 20px; background: transparent; color: var(--text-dim); font-family: inherit; font-size: .9rem; cursor: pointer; letter-spacing: .1em; transition: all .25s; text-decoration: none; display: inline-block; }
.tab-btn.active, .tab-btn:hover { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--gold-lt); }

/* ── Browse grid ── */
main { padding: 24px 20px 80px; }
.browse-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-width: 960px; margin: 0 auto; }
.card-thumb { aspect-ratio: 2/3; border-radius: 8px; border: 1px solid rgba(201,168,76,0.3); overflow: hidden; cursor: pointer; position: relative; background: var(--dark3); transition: transform .2s, border-color .2s, box-shadow .2s; }
.card-thumb:hover { transform: translateY(-4px) scale(1.04); border-color: var(--gold); box-shadow: 0 8px 24px rgba(201,168,76,0.3); }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-thumb .thumb-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.85)); padding: 10px 4px 4px; text-align: center; font-size: .62rem; color: var(--gold-lt); letter-spacing: .08em; }
.card-thumb .thumb-num { position: absolute; top: 4px; left: 6px; font-size: .55rem; color: var(--text-dim); }

/* ── Reading sections (modal) ── */
.reading-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.reading-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.section-tag { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: .7rem; letter-spacing: .15em; margin-bottom: 8px; border: 1px solid; }
.tag-lvl1 { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.1); }
.tag-lvl2 { border-color: #e87dc0; color: #e87dc0; background: rgba(232,125,192,0.1); }
.tag-lvl3 { border-color: #7dc8e8; color: #7dc8e8; background: rgba(125,200,232,0.1); }
.section-text { font-size: .92rem; line-height: 1.8; color: var(--text); }

/* ── Modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--dark2); border: 1px solid rgba(201,168,76,0.4); border-radius: 16px; max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: modalIn .25s ease; }
@keyframes modalIn { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:scale(1); } }
.modal-card-row { display: flex; gap: 20px; padding: 20px 24px 0; align-items: flex-start; }
.modal-img { width: 90px; height: 138px; border-radius: 8px; overflow: hidden; flex-shrink: 0; border: 1px solid rgba(201,168,76,0.3); background: var(--dark3); }
.modal-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal-card-num  { font-size: .7rem; color: var(--text-dim); letter-spacing: .2em; }
.modal-card-name { font-size: 2.2rem; color: var(--gold); letter-spacing: .3em; margin: 4px 0 8px; }
.modal-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 1.4rem; color: var(--text-dim); cursor: pointer; }
.modal-close:hover { color: var(--gold); }
.modal-sections { padding: 16px 24px 24px; }

/* ── Spinner ── */
.spinner { width: 36px; height: 36px; border: 3px solid rgba(201,168,76,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 900px) { .browse-grid { grid-template-columns: repeat(6, 1fr); gap: 8px; } }
@media (max-width: 600px) {
  nav { padding: 10px 14px; } .nav-title { font-size: 1.1rem; } .tab-btn { padding: 6px 14px; font-size: .82rem; }
  main { padding: 16px 12px 80px; }
  .browse-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .modal-card-row { gap: 14px; padding: 16px 16px 0; } .modal-img { width: 72px; height: 110px; } .modal-card-name { font-size: 1.7rem; } .modal-sections { padding: 12px 16px 20px; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-title">☰ 易經塔羅</div>
  <div class="nav-tabs">
    <a class="tab-btn active" href="index.html">瀏覽卦</a>
    <a class="tab-btn"        href="draw.html">抽卦</a>
  </div>
</nav>

<main>
  <div id="browse-grid" class="browse-grid"><div class="spinner"></div></div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-card-row">
      <div class="modal-img" id="modal-img"></div>
      <div>
        <div class="modal-card-num"  id="modal-num"></div>
        <div class="modal-card-name" id="modal-name"></div>
      </div>
    </div>
    <div class="modal-sections" id="modal-sections"></div>
  </div>
</div>

<script src="cards.js"></script>
<script>
var CARDS    = [];
var BACK_IMGID = '1DZsqnVI6lEVe9I9rLFWzYnNgSLwl7vyA';

function imgUrl(fileId, size) {
  if (typeof google !== 'undefined' && google.script)
    return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w' + (size || 400);
  var card = CARDS.find(function(c) { return c.imgId === fileId; });
  return card ? 'images/' + card.num + '.jpg' : 'images/back.jpg';
}

window.addEventListener('DOMContentLoaded', function() {
  if (typeof CARDS_DATA !== 'undefined') { CARDS = CARDS_DATA; buildGrid(); }
  else if (typeof google !== 'undefined' && google.script) {
    google.script.run
      .withSuccessHandler(function(d) { CARDS = d; buildGrid(); })
      .getCardsData();
  }
});

function buildGrid() {
  var grid = document.getElementById('browse-grid');
  grid.innerHTML = '';
  CARDS.forEach(function(c) {
    var div = document.createElement('div');
    div.className = 'card-thumb';
    div.onclick   = function() { openModal(c.num); };
    div.innerHTML = '<span class="thumb-num">' + c.num + '</span>' +
      '<img src="' + imgUrl(c.imgId, 400) + '" alt="' + c.name + '" loading="lazy">' +
      '<div class="thumb-label">' + c.name + '</div>';
    grid.appendChild(div);
  });
}

function openModal(num) {
  var c = CARDS[num-1];
  document.getElementById('modal-num').textContent  = '第 ' + num + ' 卦';
  document.getElementById('modal-name').textContent = c.name;
  document.getElementById('modal-img').innerHTML    = '<img src="' + imgUrl(c.imgId, 600) + '" alt="' + c.name + '">';
  document.getElementById('modal-sections').innerHTML = sections(c);
  document.getElementById('modal').classList.add('open');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal') || e.currentTarget.tagName === 'BUTTON')
    document.getElementById('modal').classList.remove('open');
}
function sections(c) {
  return sec('基礎牌義','lvl1',c.lvl1) + sec('戀愛運勢','lvl2',c.lvl2) + sec('職場・財運・性格','lvl3',c.lvl3);
}
function sec(label, cls, text) {
  return '<div class="reading-section"><span class="section-tag tag-' + cls + '">' + label + '</span><div class="section-text">' + text + '</div></div>';
}
</script>
<footer style="text-align:center;padding:24px 0 32px;color:var(--text-dim);font-size:.7rem;letter-spacing:.12em;opacity:.5">
  v1.2.0 &nbsp;·&nbsp; 2026-05-17 10:00
</footer>
</body>
</html>
